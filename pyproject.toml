[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-pdf-parser"
version = "0.1.0"
description = "A Python PDF parser for AWS documentation that converts PDFs to LLM-readable text files"
authors = [
    {name = "Devin AI", email = "devin-ai-integration@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.25",
    "langchain-community>=0.3.24",
    "langchain-unstructured>=0.1.5",
    "pypdf>=5.6.0",
    "requests>=2.32.3",
    "ruff>=0.11.13",
    "unstructured[pdf]>=0.10.0",
]

[project.scripts]
parse-pdf = "aws_pdf_parser.main:main"

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_pdf_parser"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]
